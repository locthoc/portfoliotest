<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap">
<title>Catalog</title>
<style>
:root{--bg:#241a47;--ink:#f1ece2;--dim:#a79fc4;--acc:#f2c230;--sz:min(58vw,230px);--persp:2600px;--tilt:-16deg;--cam-y:30%;--drop:70px;--pad:36px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column}
#stage,#info{position:relative;z-index:1}
.bg{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity .1s linear;z-index:0;pointer-events:none}
#scrim{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(0,0,0,.32)}
#stage{flex:0 0 58dvh;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;-webkit-user-select:none}
#wheel{position:relative;width:var(--sz);aspect-ratio:1;}
.cv{position:absolute;inset:0;border-radius:4px;will-change:transform;box-shadow:0 8px 20px #0005}
.art{position:absolute;inset:0;border-radius:4px}
.art{overflow:hidden;background:#1c1633;will-change:opacity}
.art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.cv,.cn,.cf{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cn,.cf{position:absolute;left:calc(-1*var(--pad));top:calc(-1*var(--pad));width:calc(var(--sz) + 2*var(--pad));height:calc(var(--sz) + 2*var(--pad));opacity:0;pointer-events:none;will-change:opacity}
.art b{font:700 17px Georgia,serif;color:#fff;text-shadow:0 1px 8px #0008;position:relative}
.art i{position:absolute;border-radius:50%}
#wheel.snap .cv{transition:transform .4s cubic-bezier(.2,.9,.25,1)}
#wheel.snap .art,#wheel.snap .cn,#wheel.snap .cf{transition:opacity .4s}
.play{position:absolute;right:10px;top:10px;width:46px;height:46px;border-radius:50%;background:#000b;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.front .play{pointer-events:auto}
.front:hover .play,.front.on .play{opacity:1}
@media(hover:none){.front .play{opacity:1}}
.play:after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.on .play:after{border:0;width:14px;height:16px;margin:0;border-left:5px solid #fff;border-right:5px solid #fff}
#info{flex:1;padding:14px 26px calc(14px + env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
#bar{width:var(--sz);height:3px;background:#ffffff22;border-radius:2px;overflow:hidden}
#bar div{height:100%;width:0;background:var(--acc)}
h1{font:700 24px/1.25 'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif;margin-top:8px;max-width:92%;overflow-wrap:anywhere;text-wrap:balance}
#meta{color:var(--dim);font-size:14px}
h1 .ty{font-size:14px;font-weight:400;color:#d9d3ea;margin-left:6px;white-space:nowrap}
#blurb{white-space:pre-line;font-size:14px;line-height:1.5;max-width:34ch;color:#d9d3ea}
#links{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
#links a{color:var(--ink);border:1px solid #ffffff44;border-radius:99px;padding:7px 14px;font-size:13px;text-decoration:none}
#links a:active,#links a:hover{background:var(--acc);color:#241a47;border-color:var(--acc)}
#hint{font-size:12px;color:var(--dim);margin-top:auto}
@media(prefers-reduced-motion:reduce){#wheel.snap *{transition:none!important}}
</style></head><body>
<canvas id="bgA" class="bg" width="64" height="64"></canvas><canvas id="bgB" class="bg" width="64" height="64"></canvas><div id="scrim"></div>
<div id="stage"><div id="wheel"></div></div>
<div id="info">
<div id="bar"><div></div></div>
<h1 id="t"></h1><div id="meta"></div><p id="blurb"></p>
<div id="links"><a href="#">Spotify</a><a href="#">Bandcamp</a><a href="#">SoundCloud</a></div>

e.style.transform=`translateY(${VY}px) perspective(${PP}px) translateY(${-VY+DROP}px) rotateX(${TILT}deg) translate3d(${x}px,${-fw*TS}px,${fw-(ARC-Math.sqrt(ARC*ARC-Math.min(Math.abs(x),ARC*.98)**2))}px) rotateY(${-sg*ang}deg) scale(${1-UNS*s})`;
e.style.zIndex=1000-Math.round(m*100);e.style.opacity=m>V-1?Math.max(0,V+.3-m)/1.3:1;
e.classList.toggle('front',m<.5);
if(e._ready){if(sg&&e._dir!==sg){e._dir=sg;compose(e)}
e._a.style.opacity=Math.max(0,Math.min(1,(1-s)/.4));e._cn.style.opacity=s;e._cf.style.opacity=s2}else e._a.style.opacity=1})}
function info(){const d=D[idx];t.textContent=d.t;if(d.ty){const sp=document.createElement('span');sp.className='ty';sp.textContent=d.ty[0].toUpperCase()+d.ty.slice(1);t.append(' ',sp)}meta.textContent=d.a;blurb.textContent=d.r||'';setBg()}
function setIdx(){const n=((Math.round(cur)%N)+N)%N;if(n!==idx){stop();idx=n;info();pump()}}
let pend=false;const req=()=>{if(!pend){pend=true;requestAnimationFrame(()=>{pend=false;paint();setIdx()})}};
let x0=null,moved=0,last=0,onPlay=false;
S.addEventListener('dragstart',e=>e.preventDefault());S.addEventListener('selectstart',e=>e.preventDefault());S.addEventListener('contextmenu',e=>{if(e.target.closest('.cv'))e.preventDefault()});
S.addEventListener('pointerdown',e=>{x0=e.clientX;moved=0;onPlay=!!e.target.closest('.play');W.classList.remove('snap');S.setPointerCapture(e.pointerId)});
S.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=e.clientX;moved+=Math.abs(dx);cur=cl(cur-dx/PX);req()});
S.addEventListener('pointerup',()=>{if(x0==null)return;x0=null;if(moved<6){if(onPlay)toggle();return}snap()});
S.addEventListener('wheel',e=>{e.preventDefault();W.classList.remove('snap');cur=cl(cur+(e.deltaX||e.deltaY)/PX);req();clearTimeout(last);last=setTimeout(snap,120)},{passive:false});
function snap(){W.classList.add('snap');cur=Math.round(cur);paint();setIdx()}
let ctx,timer,raf,t0,playing=false;const DUR=12000,bar=document.querySelector('#bar div');
function toggle(){playing?stop():start()}
function start(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();playing=true;t0=performance.now();
const base=140+(idx%12)*18,sc=[0,2,4,7,9,12];let k=idx*7+3,n=0;
timer=setInterval(()=>{k=(k*37+11)%97;const f=base*Math.pow(2,sc[k%sc.length]/12)*(n%8<4?1:1.5);n++;
const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;
g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.32);
o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.35)},230);
els[idx].classList.add('on');tick()}
function tick(){const p=(performance.now()-t0)/DUR;bar.style.width=Math.min(p,1)*100+'%';if(p>=1)stop();else raf=requestAnimationFrame(tick)}
function stop(){playing=false;clearInterval(timer);cancelAnimationFrame(raf);els.forEach(e=>e.classList.remove('on'));bar.style.width='0'}
const t=document.getElementById('t'),meta=document.getElementById('meta'),blurb=document.getElementById('blurb');

/* ---- depth blur: baked once per sleeve into a canvas whose blur grows from the near edge to the far edge ---- */
const CH=CW,T=document.createElement('canvas');T.width=CW;T.height=CH;
const SIG={n:[0,3,7,12],f:[4,8,13,19]},CEN=[.12,.42,.72,1];
function drawArt(x,d){const o=PAD*SC,S=SZ*SC;x.save();x.beginPath();x.roundRect?x.roundRect(o,o,S,S,4*SC):x.rect(o,o,S,S);x.clip();x.fillStyle='#1c1633';x.fillRect(o,o,S,S);x.drawImage(d.img,o,o,S,S);x.restore()}
function pass(a,b,w,h,r,H){const n=H?w:h,m=H?h:w,st=H?4:4*w,ln=H?4*w:4,k=2*r+1;
for(let j=0;j<m;j++){const o=j*ln;for(let c=0;c<4;c++){let sum=0;for(let i=-r;i<=r;i++)sum+=a[o+Math.min(n-1,Math.max(0,i))*st+c];
for(let i=0;i<n;i++){b[o+i*st+c]=sum/k;sum+=a[o+Math.min(n-1,i+r+1)*st+c]-a[o+Math.max(0,i-r)*st+c]}}}}
function blurSmall(c,r){const w=c.width,h=c.height,x=c.getContext('2d',{willReadFrequently:true}),id=x.getImageData(0,0,w,h),p=id.data,n=p.length;
let a=new Float32Array(n),b=new Float32Array(n);
for(let i=0;i<n;i+=4){const al=p[i+3]/255;a[i]=p[i]*al;a[i+1]=p[i+1]*al;a[i+2]=p[i+2]*al;a[i+3]=p[i+3]}
for(let k=0;k<3;k++){pass(a,b,w,h,r,1);pass(b,a,w,h,r,0)}
for(let i=0;i<n;i+=4){const al=a[i+3]/255;if(al>.002){p[i]=a[i]/al;p[i+1]=a[i+1]/al;p[i+2]=a[i+2]/al}p[i+3]=a[i+3]}
x.putImageData(id,0,0)}
function level(S,sig){const f=sig<=4?.5:sig<=9?.33:.25,c=document.createElement('canvas');c.width=Math.ceil(CW*f);c.height=Math.ceil(CH*f);
c.getContext('2d').drawImage(S,0,0,c.width,c.height);blurSmall(c,Math.max(1,Math.round(sig*SC*f-.5)));return c}
function compose(e){const dir=e._dir;
for(const kind of ['n','f']){const cv=kind==='n'?e._cn:e._cf,x=cv.getContext('2d');x.globalCompositeOperation='source-over';x.clearRect(0,0,CW,CH);x.globalCompositeOperation='lighter';
const xo=dir>0?(PAD+SZ)*SC:PAD*SC,xi=dir>0?PAD*SC:(PAD+SZ)*SC,A=a=>`rgba(0,0,0,${a})`;
e._lv[kind].forEach((src,k)=>{const t=T.getContext('2d');t.globalCompositeOperation='source-over';t.clearRect(0,0,CW,CH);t.drawImage(src,0,0,CW,CH);
t.globalCompositeOperation='destination-in';const g=t.createLinearGradient(xo,0,xi,0);
if(k===0){g.addColorStop(0,A(1));g.addColorStop(CEN[0],A(1))}else g.addColorStop(CEN[k-1],A(0));
if(k>0)g.addColorStop(CEN[k],A(1));if(k<3)g.addColorStop(CEN[k+1],A(0));
t.fillStyle=g;t.fillRect(0,0,CW,CH);x.drawImage(T,0,0)})}}
function bake(e,i){const S=document.createElement('canvas');S.width=CW;S.height=CH;drawArt(S.getContext('2d'),D[i]);
e._lv={n:[S,...SIG.n.slice(1).map(g=>level(S,g))],f:SIG.f.map(g=>level(S,g))};
for(const c of [e._cn,e._cf]){c.width=CW;c.height=CH}compose(e);e._ready=true}
function free(e){e._ready=false;e._lv=null;e._cn.width=e._cf.width=1}
const dist=i=>Math.abs(((i-idx+N/2)%N+N)%N-N/2);let pt=0;
function pump(){clearTimeout(pt);let best=-1,bd=99;
els.forEach((e,i)=>{const dd=dist(i);if(!e._ready&&D[i].img.naturalWidth&&dd<=V+2.5&&dd<bd){bd=dd;best=i}if(e._ready&&dd>V+3.5)free(e)});
if(best>=0){bake(els[best],best);req();pt=setTimeout(pump,10)}}
/* blurred backdrop: selected cover shrunk to 48px, heavily box-blurred, stretched full-screen, 0.1s crossfade between two layers */
const BG=[document.getElementById('bgA'),document.getElementById('bgB')];let bgi=0,bgShown=-1;
function setBg(){const d=D[idx];if(!d||!d.img.naturalWidth||bgShown===idx)return;
if(!d.bg){const c=document.createElement('canvas');c.width=c.height=64;c.getContext("2d",{willReadFrequently:true}).drawImage(d.img,0,0,64,64);blurSmall(c,3);d.bg=c}
const n=BG[bgi^1],o=BG[bgi];n.getContext('2d').drawImage(d.bg,0,0);n.style.opacity=1;o.style.opacity=0;bgi^=1;bgShown=idx}
paint();info();setTimeout(pump,30);
</script></body></html>
